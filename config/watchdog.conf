# /etc/watchdog.conf — Hardware watchdog configuration
# Requiere: sudo apt install watchdog && sudo systemctl enable --now watchdog

# Dispositivo de watchdog del kernel (típico en hardware moderno)
watchdog-device = /dev/watchdog

# Intervalo de ping al hardware watchdog (segundos)
# Debe ser MENOR que el timeout del hardware (usualmente 60s)
interval = 10

# Timeout del watchdog de hardware en segundos
# Si el kernel no recibe ping en este tiempo, reinicia hardware
watchdog-timeout = 30

# ============================================================
# Checks de salud del sistema (software watchdog)
# Si cualquiera falla, watchdog NO pingea al hardware -> reboot
# ============================================================

# 1. Load average (15 min) — reboot si > 24 (núcleos * 2)
max-load-1 = 24

# 2. Memoria libre mínima (MB) — reboot si < 100MB
min-memory = 100

# 3. Verificar que procesos críticos estén vivos
# PID files de nuestros servicios
pidfile = /run/valentina-bridge.pid
pidfile = /run/dispatcher-bot.pid
pidfile = /run/telegram-bot.pid
pidfile = /run/cloudflared.pid

# 4. Verificar que el filesystem raíz no esté lleno
# (espacio libre en %)
# max-temperature = 80  # si tienes sensores

# 5. Test de conectividad de red (ping a gateway)
# Descomenta y ajusta si quieres:
# ping = 192.168.1.1
# ping-count = 3
# ping-interval = 10

# 6. Test de archivo — verificar que podemos escribir
test-binary = /mnt/ssd_trabajo/hermes-agent/scripts/health_check.py
test-timeout = 15

# ============================================================
# Logging
# ============================================================
logtick = 60          # log heartbeat cada 60s
log-dir = /var/log/watchdog

# ============================================================
# Comportamiento en fallos
# ============================================================
reboot = 1            # 1 = reboot, 0 = solo log (para testing)
shutdown = 0          # no apagar, solo reboot
realtime = yes        # prioridad realtime
priority = 1          # nice level

# ============================================================
# NMI watchdog (kernel) - detecta hard lockups
# ============================================================
# nmi-watchdog = 1