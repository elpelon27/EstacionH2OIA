# /etc/systemd/journald.conf.d/valentina-bridge.conf
# Log rotation config for valentina-bridge service
# Rotate journals to limit disk usage

[Journal]
# Max total disk usage for all journals (default 10%)
SystemMaxUse=500M

# Max disk usage per journal file (default 1/8 of SystemMaxUse)
SystemMaxFileSize=50M

# Number of journal files to keep (default 100)
SystemMaxFiles=50

# Max age of journal files before rotation (default 1 month)
MaxFileSec=7day

# Max total disk usage for runtime (volatile) journals
RuntimeMaxUse=200M

# Max runtime journal file size
RuntimeMaxFileSize=20M

# Number of runtime journal files to keep
RuntimeMaxFiles=20

# Max age for runtime journals
RuntimeMaxFileSec=1day

# Compress journals
Compress=yes

# Sync interval (default 5m)
SyncIntervalSec=1m

# Rate limiting - limit log bursts
RateLimitIntervalSec=30s
RateLimitBurst=1000

# Forward to syslog (optional, if using rsyslog)
ForwardToSyslog=no

# Forward to kmsg
ForwardToKMsg=no

# Forward to console
ForwardToConsole=no

# Forward to wall
ForwardToWall=yes

# Line max (default 48K)
LineMax=48K

# Read kernel messages
ReadKMsg=yes

# Audit (if auditd is present)
Audit=yes