[options]
; This is the password that allows database operations:
admin_passwd = admin_secure_2026

; Database connection - valores LITERALES (Odoo NO expande variables ${})
db_host = odoo-db
db_port = 5432
db_user = odoo
db_password = odoo_secure_pass_2026
db_name = postgres

; Limit the number of workers (prefork)
workers = 2
max_cron_threads = 1

; Limit memory per worker
limit_memory_hard = 1073741824
limit_memory_soft = 805306368

; Limit request time
limit_time_cpu = 600
limit_time_real = 1200

; Enable proxy mode (for reverse proxy / Cloudflare Tunnel)
proxy_mode = True

; Security
list_db = True

; Logging
logfile = False
log_level = info

; Addons path (built-in + custom)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Email (configure later if needed)
; email_from = administracion@estacionh2o.com
; smtp_server = localhost
; smtp_port = 25