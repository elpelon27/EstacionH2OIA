services:
  waha:
    image: devlikeapro/waha:latest
    container_name: hermes_waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WAHA_WORKER_RESTART_SESSIONS=True
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_HOOK_URL=http://172.17.0.1:8000/webhook/whatsapp
      # FIX: Eliminar message.any (causaba duplicados). Solo message y session.status
      - WHATSAPP_HOOK_EVENTS=message,session.status
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_WEBHOOK_SECRET}
      - WHATSAPP_HOOK_HMAC_ALGORITHM=sha512
      # Anti-duplicados: configuración de reintentos
      - WHATSAPP_HOOK_RETRIES_POLICY=constant
      - WHATSAPP_HOOK_RETRIES_DELAY_SECONDS=5
      - WHATSAPP_HOOK_RETRIES_ATTEMPTS=2
    volumes:
      - /mnt/ssd_trabajo/waha/sessions:/app/.sessions
      - /mnt/ssd_trabajo/waha/media:/app/.media
    networks:
      - hermes_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hermes_net:
    external: true
    name: infra_hermes_net
