services:
  # === QDRANT — DB vectorial para mem0 ===
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: hermes_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - /mnt/ssd_trabajo/qdrant/storage:/qdrant/storage
      - /mnt/ssd_trabajo/qdrant/snapshots:/qdrant/snapshots
    networks:
      - hermes_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === REDIS — Colas y cache ===
  redis:
    image: redis:7-alpine
    container_name: hermes_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass hermes_redis_dev_change_me
    volumes:
      - /mnt/ssd_trabajo/redis/data:/data
    networks:
      - hermes_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "hermes_redis_dev_change_me", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === PROMETHEUS — Métricas ===
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: hermes_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - /mnt/ssd_trabajo/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - hermes_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === GRAFANA — Dashboard ===
  grafana:
    image: grafana/grafana:11.4.0
    container_name: hermes_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hermes_grafana_change_me
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - /mnt/ssd_trabajo/grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - hermes_net
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === NODE EXPORTER — Métricas host (CPU, RAM, disco) ===
  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: hermes_node_exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - hermes_net

  # === LOKI — Log aggregation ===
  loki:
    image: grafana/loki:3.2.1
    container_name: hermes_loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /mnt/ssd_trabajo/loki/data:/loki
    command:
      - '--config.file=/etc/loki/loki-config.yml'
    networks:
      - hermes_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === PROMTAIL — Recolector de logs (journalctl → Loki) ===
  promtail:
    image: grafana/promtail:3.2.1
    container_name: hermes_promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    command:
      - '--config.file=/etc/promtail/promtail-config.yml'
    networks:
      - hermes_net
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hermes_net:
    driver: bridge
