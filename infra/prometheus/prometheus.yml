global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  # Hermes Agent metrics
  - job_name: 'hermes'
    static_configs:
      - targets: ['172.17.0.1:8000']
    metrics_path: /metrics
