global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Reglas de alerta (Estación H2O) — infra/prometheus/rules/
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  # Hermes Agent metrics (bridge :8000)
  - job_name: 'hermes'
    static_configs:
      - targets: ['172.17.0.1:8000']
    metrics_path: /metrics

  # GPU Exporter (nvidia-smi vía systemd gpu-exporter :9101)
  - job_name: 'gpu'
    static_configs:
      - targets: ['172.17.0.1:9101']
    metrics_path: /metrics
