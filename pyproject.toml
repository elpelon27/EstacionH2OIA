[project]
name = "hermes-agent"
version = "0.1.0"
description = "Orquestador IA para Estación H2O / Valentina Proactiva"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "slowapi==0.1.9",
    "prometheus-client==0.21.0",
    "python-json-logger==2.0.7",
    "python-telegram-bot==21.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# Relajar mypy para tests (no requieren type annotations completas)
[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

# OR-Tools - no tiene stubs tipados
[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true

# sdnotify - no tiene stubs tipados
[[tool.mypy.overrides]]
module = "sdnotify"
ignore_missing_imports = true

# Financial module - relax some strict settings for now
[[tool.mypy.overrides]]
module = "financial.*"
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=core --cov=agents --cov=api --cov-report=term-missing"

[tool.coverage.run]
source = ["core", "agents", "api"]
omit = ["tests/*"]
