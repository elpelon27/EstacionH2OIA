name: CI/CD - Estacion H2O

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -q ruff mypy pytest pytest-asyncio prometheus-client

      - name: Run Ruff
        run: ruff check api/ core/ --output-format=github

      - name: Run MyPy
        run: mypy api/ core/ --ignore-missing-imports --no-error-summary || true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: pip install -q fastapi==0.115.0 uvicorn[standard]==0.30.6 httpx==0.27.2 slowapi==0.1.9 prometheus-client==0.21.0 python-json-logger==2.0.7 python-telegram-bot==21.6 pydantic pydantic_settings sqlalchemy aiosqlite python-dotenv structlog pytest==8.3.3 pytest-asyncio==0.24.0 pytest-cov==5.0.0 openai ortools

      - name: Run Tests
        run: python -m pytest tests/unit/ -x --tb=short -q

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bandit
        run: |
          pip install -q bandit
          bandit -r api/ core/ -f json -o bandit-report.json || true

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  # Deploy jobs removidos - se ejecutan manualmente en el servidor