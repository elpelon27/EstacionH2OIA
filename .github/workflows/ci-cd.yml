name: CI/CD - Estacion H2O

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.12'
  PROJECT_DIR: '/mnt/ssd_trabajo/hermes-agent'
  VENV_DIR: '/mnt/ssd_trabajo/hermes-agent/venv'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          pip install -q ruff mypy pytest pytest-asyncio prometheus-client

      - name: Run Ruff
        run: |
          cd ${{ env.PROJECT_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          ruff check api/ core/ skills/ src/ --output-format=github

      - name: Run MyPy
        run: |
          cd ${{ env.PROJECT_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          mypy api/ core/ skills/ src/ --ignore-missing-imports --no-error-summary || true

  test:
    name: Test Suite
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install test dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          pip install -q pytest pytest-asyncio pytest-cov

      - name: Run Tests
        run: |
          cd ${{ env.PROJECT_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          BRIDGE_ALLOW_INSECURE_SALT=1 python -m pytest tests/ --ignore=tests/unit/test_bridge.py -x --tb=short -q

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.PROJECT_DIR }}/htmlcov/

  security:
    name: Security Scan
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bandit
        run: |
          cd ${{ env.PROJECT_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          pip install -q bandit
          bandit -r api/ core/ skills/ src/ -f json -o bandit-report.json || true

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: ${{ env.PROJECT_DIR }}/bandit-report.json

  deploy-staging:
    name: Deploy Staging
    runs-on: self-hosted
    needs: [lint, test, security]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          cd ${{ env.PROJECT_DIR }}
          git pull origin develop
          sudo systemctl restart valentina-bridge
          sudo systemctl restart dispatcher-bot
          sudo systemctl restart telegram-bot
          sudo systemctl restart prometeo-telegram
          sleep 10
          curl -sf http://localhost:8000/health | jq -e '.status == "ok"' || exit 1
          curl -sf http://localhost:9090/-/healthy || exit 1
          echo "Staging deployment successful"

      - name: Notify Telegram
        if: always()
        run: |
          cd ${{ env.PROJECT_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          python3 -c "
import os, asyncio, httpx
token = os.getenv('TELEGRAM_BOT_TOKEN')
chat_id = os.getenv('TELEGRAM_CHAT_ID', '1663148211')
status = 'SUCCESS' if '${{ job.status }}' == 'success' else 'FAILED'
msg = f'{status} Deploy Staging - Estacion H2O
Branch: develop
Commit: ${{ github.sha[:7] }}'
async def send():
    async with httpx.AsyncClient() as client:
        await client.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': msg})
asyncio.run(send())
          " || true

  deploy-production:
    name: Deploy Production
    runs-on: self-hosted
    needs: [lint, test, security, deploy-staging]
    if: github.ref == 'refs/heads/main' and github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-deployment checks
        run: |
          cd ${{ env.PROJECT_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          BRIDGE_ALLOW_INSECURE_SALT=1 python -m pytest tests/ --ignore=tests/unit/test_bridge.py -x -q || exit 1
          sqlite3 /mnt/ssd_trabajo/hermes-agent/data/conversations.db "PRAGMA integrity_check;" | grep -q "ok" || exit 1
          sqlite3 /mnt/ssd_trabajo/hermes-agent/data/dispatch.db "PRAGMA integrity_check;" | grep -q "ok" || exit 1
          curl -sf http://localhost:8000/health | jq -e '.status == "ok"' || exit 1
          echo "Pre-deployment checks passed"

      - name: Backup databases
        run: |
          cd ${{ env.PROJECT_DIR }}
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p /mnt/ssd_trabajo/backups/pre-deploy
          cp /mnt/ssd_trabajo/hermes-agent/data/conversations.db /mnt/ssd_trabajo/backups/pre-deploy/conversations_${TIMESTAMP}.db
          cp /mnt/ssd_trabajo/hermes-agent/data/dispatch.db /mnt/ssd_trabajo/backups/pre-deploy/dispatch_${TIMESTAMP}.db
          echo "Backups created"

      - name: Deploy to Production
        run: |
          cd ${{ env.PROJECT_DIR }}
          git pull origin main
          source ${{ env.VENV_DIR }}/bin/activate
          pip install -r requirements.txt -q
          source ${{ env.VENV_DIR }}/bin/activate
          python3 -c "
from src.financial.database import init_database_v3
init_database_v3()
print('DB migrations applied')
          "
          sudo systemctl restart valentina-bridge
          sleep 5
          sudo systemctl restart dispatcher-bot
          sudo systemctl restart telegram-bot
          sudo systemctl restart prometeo-telegram
          sleep 15
          echo "Services restarted"

      - name: Post-deployment verification
        run: |
          cd ${{ env.PROJECT_DIR }}
          curl -sf http://localhost:8000/health | jq -e '.status == "ok"' || exit 1
          curl -sf http://localhost:9090/-/healthy || exit 1
          curl -sf -u admin:${GRAFANA_ADMIN_PASSWORD} http://localhost:3001/api/health || exit 1
          source ${{ env.VENV_DIR }}/bin/activate
          python3 -c "
from core.workload_router import get_router
import asyncio
async def test():
    router = get_router()
    r = await router.execute(trigger='dispatch_request', action='get_bottle_inventory')
    assert r['success'], f'Bottle inventory failed: {r}'
    print('WorkloadRouter - DispatcherSkill OK')
asyncio.run(test())
          "
          echo "Post-deployment verification passed"

      - name: Notify Telegram
        if: always()
        run: |
          cd ${{ env.PROJECT_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          python3 -c "
import os, asyncio, httpx
token = os.getenv('TELEGRAM_BOT_TOKEN')
chat_id = os.getenv('TELEGRAM_CHAT_ID', '1663148211')
status = 'SUCCESS' if '${{ job.status }}' == 'success' else 'FAILED - ROLLBACK REQUIRED'
msg = f'{status} Deploy PRODUCCION - Estacion H2O
Branch: main
Commit: ${{ github.sha[:7] }}'
if '${{ job.status }}' != 'success':
    msg += '

ROLLBACK MANUAL: sudo systemctl restart valentina-bridge dispatcher-bot telegram-bot prometeo-telegram'
async def send():
    async with httpx.AsyncClient() as client:
        await client.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': msg})
asyncio.run(send())
          " || true

      - name: Rollback on failure
        if: failure()
        run: |
          echo "DEPLOYMENT FAILED - Initiating rollback"
          cd ${{ env.PROJECT_DIR }}
          LATEST_BACKUP=$(ls -t /mnt/ssd_trabajo/backups/pre-deploy/conversations_*.db | head -1)
          if [ -n "$LATEST_BACKUP" ]; then
            cp "$LATEST_BACKUP" /mnt/ssd_trabajo/hermes-agent/data/conversations.db
            cp "${LATEST_BACKUP/conversations/dispatch}" /mnt/ssd_trabajo/hermes-agent/data/dispatch.db
            echo "Databases restored from backup"
          fi
          sudo systemctl restart valentina-bridge dispatcher-bot telegram-bot prometeo-telegram
          sleep 10
          curl -sf http://localhost:8000/health | jq -e '.status == "ok"' && echo "Rollback successful" || echo "Rollback failed - MANUAL INTERVENTION REQUIRED"

  notify:
    name: Notify Results
    runs-on: self-hosted
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "=== CI/CD Pipeline Summary ==="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Deploy Staging: ${{ needs.deploy-staging.result }}"
          echo "Deploy Production: ${{ needs.deploy-production.result }}"
