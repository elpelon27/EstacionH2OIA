name: CI/CD Pipeline

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

env:
  BRIDGE_ALLOW_INSECURE_SALT: "1"
  DISPATCH_DB_PATH: "/mnt/ssd_trabajo/hermes-agent/data/dispatch.db"
  SQLITE_PATH: "/mnt/ssd_trabajo/hermes-agent/data/conversations.db"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov
      - name: Run ruff
        run: ruff check skills/ src/ tests/
      - name: Run mypy (core/api)
        run: mypy core/ api/ --ignore-missing-imports

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run unit tests
        run: |
          BRIDGE_ALLOW_INSECURE_SALT=1 pytest tests/unit/test_bridge.py tests/unit/financial/ tests/unit/test_kill_switch.py tests/unit/test_api.py -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Prepare test databases
        run: |
          mkdir -p /mnt/ssd_trabajo/hermes-agent/data
          sqlite3 /mnt/ssd_trabajo/hermes-agent/data/conversations.db <<'EOF'
          CREATE TABLE IF NOT EXISTS dispatch_queue (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              fs_pedido_id INTEGER,
              cliente_nombre TEXT,
              cliente_telefono TEXT,
              producto_desc TEXT,
              total_eur REAL,
              total_bs REAL,
              metodo_pago TEXT,
              gps_lat REAL,
              gps_lng REAL,
              gps_url TEXT,
              direccion TEXT,
              chofer_asignado TEXT,
              estado TEXT DEFAULT 'pending',
              enviado_at TEXT,
              respondido_at TEXT,
              creado_at TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS fs_pedidos (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              pedido_id INTEGER NOT NULL UNIQUE,
              cliente_telefono TEXT NOT NULL,
              cliente_nombre TEXT,
              monto_total_eur REAL NOT NULL,
              monto_total_ves REAL,
              tasa_eur_ves REAL,
              tasa_eur_ves_deuda REAL,
              botellones_cantidad INTEGER,
              metodo_pago TEXT,
              estado_pago TEXT DEFAULT 'pendiente',
              estado_entrega TEXT DEFAULT 'pendiente',
              monto_pagado_eur REAL DEFAULT 0,
              creado_at TEXT,
              actualizado_at TEXT
          );
          CREATE TABLE IF NOT EXISTS fs_pagos (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              fs_pedido_id INTEGER NOT NULL,
              monto_eur REAL NOT NULL,
              metodo_pago TEXT,
              referencia TEXT,
              tasa_eur_ves_pago REAL,
              verificado INTEGER DEFAULT 1,
              verificado_por TEXT,
              creado_at TEXT
          );
          CREATE TABLE IF NOT EXISTS fs_verificacion_log (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              fs_pedido_id INTEGER NOT NULL,
              intento INTEGER NOT NULL,
              metodo TEXT,
              monto_eur REAL,
              resultado TEXT,
              creado_at TEXT
          );
          CREATE TABLE IF NOT EXISTS fs_audit_log (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              tabla TEXT NOT NULL,
              registro_id INTEGER NOT NULL,
              accion TEXT NOT NULL,
              estado_anterior TEXT,
              estado_nuevo TEXT,
              modificado_por TEXT,
              creado_at TEXT
          );
          CREATE TABLE IF NOT EXISTS fs_cuentas_cobrar (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              cliente_telefono TEXT NOT NULL,
              cliente_nombre TEXT,
              fs_pedido_id INTEGER,
              monto_eur REAL,
              estado TEXT DEFAULT 'pendiente',
              fecha_vencimiento TEXT,
              creado_at TEXT
          );
          EOF
          sqlite3 /mnt/ssd_trabajo/hermes-agent/data/dispatch.db <<'EOF'
          CREATE TABLE IF NOT EXISTS vehicles (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              name TEXT NOT NULL,
              operator_name TEXT,
              telegram_chat_id INTEGER,
              max_full_bottles INTEGER DEFAULT 30,
              max_empty_bottles INTEGER DEFAULT 70,
              current_full_load INTEGER DEFAULT 0,
              current_empty_load INTEGER DEFAULT 0,
              shift TEXT,
              active INTEGER DEFAULT 1,
              created_at REAL NOT NULL DEFAULT (strftime('%s','now'))
          );
          CREATE TABLE IF NOT EXISTS clients (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              phone TEXT NOT NULL,
              phone_hash TEXT NOT NULL,
              name TEXT,
              address_text TEXT,
              lat REAL,
              lng REAL,
              client_type TEXT NOT NULL DEFAULT 'retail',
              avg_bottles_per_visit INTEGER DEFAULT 1,
              visit_frequency TEXT,
              visit_days TEXT,
              priority INTEGER DEFAULT 5,
              zone_id INTEGER,
              bottle_exchange_model INTEGER DEFAULT 0,
              bottle_return_hours INTEGER DEFAULT 36,
              active INTEGER DEFAULT 1,
              notes TEXT,
              created_at REAL NOT NULL DEFAULT (strftime('%s','now')),
              updated_at REAL NOT NULL DEFAULT (strftime('%s','now'))
          );
          CREATE TABLE IF NOT EXISTS deliveries (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              dispatch_session_id INTEGER NOT NULL,
              client_id INTEGER NOT NULL,
              vehicle_id INTEGER NOT NULL,
              order_sequence INTEGER NOT NULL,
              status TEXT NOT NULL DEFAULT 'pending',
              bottles_full INTEGER DEFAULT 0,
              bottles_empty_pickup INTEGER DEFAULT 0,
              bottles_on_site_refill INTEGER DEFAULT 0,
              estimated_arrival REAL,
              actual_arrival REAL,
              actual_departure REAL,
              duration_seconds INTEGER,
              operator_notes TEXT,
              feedback_score INTEGER,
              created_at REAL NOT NULL DEFAULT (strftime('%s','now')),
              updated_at REAL NOT NULL DEFAULT (strftime('%s','now'))
          );
          CREATE TABLE IF NOT EXISTS dispatch_sessions (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              vehicle_id INTEGER NOT NULL,
              shift TEXT NOT NULL,
              date TEXT NOT NULL,
              status TEXT NOT NULL DEFAULT 'planning',
              total_clients INTEGER DEFAULT 0,
              total_bottles_full INTEGER DEFAULT 0,
              total_distance_km REAL DEFAULT 0,
              total_duration_minutes INTEGER DEFAULT 0,
              route_algorithm TEXT DEFAULT 'ortools_vrp',
              route_computed_at REAL,
              started_at REAL,
              completed_at REAL,
              created_at REAL NOT NULL DEFAULT (strftime('%s','now'))
          );
          CREATE TABLE IF NOT EXISTS gps_tracks (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              vehicle_id INTEGER NOT NULL,
              lat REAL NOT NULL,
              lng REAL NOT NULL,
              accuracy REAL,
              speed_kmh REAL,
              source TEXT NOT NULL DEFAULT 'telegram',
              delivery_id INTEGER,
              track_type TEXT DEFAULT 'periodic',
              created_at REAL NOT NULL DEFAULT (strftime('%s','now'))
          );
          CREATE TABLE IF NOT EXISTS geofence_events (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              vehicle_id INTEGER NOT NULL,
              event_type TEXT NOT NULL,
              zone_id INTEGER,
              lat REAL NOT NULL,
              lng REAL NOT NULL,
              created_at REAL NOT NULL DEFAULT (strftime('%s','now'))
          );
          CREATE TABLE IF NOT EXISTS zones (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              name TEXT NOT NULL,
              description TEXT,
              center_lat REAL,
              center_lng REAL,
              radius_km REAL,
              color TEXT DEFAULT '#3B82F6',
              created_at REAL NOT NULL DEFAULT (strftime('%s','now'))
          );
          CREATE TABLE IF NOT EXISTS dispatch_queue (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              fs_pedido_id INTEGER,
              cliente_nombre TEXT,
              cliente_telefono TEXT,
              producto_desc TEXT,
              total_eur REAL,
              total_bs REAL,
              metodo_pago TEXT,
              gps_lat REAL,
              gps_lng REAL,
              gps_url TEXT,
              direccion TEXT,
              chofer_asignado TEXT,
              estado TEXT DEFAULT 'pending',
              enviado_at TEXT,
              respondido_at TEXT,
              creado_at TEXT NOT NULL
          );
          INSERT OR IGNORE INTO vehicles (id, name, operator_name, telegram_chat_id) VALUES (1, 'Triciclo 1', 'YORDANIS', 123456789);
          INSERT OR IGNORE INTO vehicles (id, name, operator_name, telegram_chat_id) VALUES (2, 'Triciclo 2', 'EVERT', 987654321);
          INSERT OR IGNORE INTO zones (id, name, center_lat, center_lng, radius_km) VALUES (1, 'Norte', 10.6700, -71.6300, 8.0);
          INSERT OR IGNORE INTO zones (id, name, center_lat, center_lng, radius_km) VALUES (2, 'Centro', 10.6447, -71.6101, 5.0);
          INSERT OR IGNORE INTO zones (id, name, center_lat, center_lng, radius_km) VALUES (3, 'Sur-Este', 10.6100, -71.5800, 7.0);
          EOF
      - name: Run integration tests
        run: |
          BRIDGE_ALLOW_INSECURE_SALT=1 pytest tests/integration/ -v --tb=short
        timeout-minutes: 10

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run security validation
        run: |
          BRIDGE_ALLOW_INSECURE_SALT=1 python scripts/ci/security_check.py

  full-test:
    name: Full Test Suite
    needs: [lint, unit-tests, integration-tests, security-tests]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"